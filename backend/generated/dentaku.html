<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>dentaku</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e1e2f,#2d2d44)}.calc{width:340px;max-width:92vw;background:#23232f;border-radius:24px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.5)}.title{color:#888;font-size:13px;letter-spacing:2px;text-transform:uppercase;text-align:center;margin-bottom:12px}.display{background:#16161f;border-radius:16px;padding:18px 20px;margin-bottom:18px;text-align:right;overflow:hidden}.expr{color:#777;font-size:15px;min-height:20px;word-break:break-all}.result{color:#fff;font-size:42px;font-weight:600;word-break:break-all}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}button{border:none;border-radius:16px;height:64px;font-size:22px;font-weight:500;cursor:pointer;color:#fff;background:#33334a;transition:.15s;user-select:none}button:hover{filter:brightness(1.2)}button:active{transform:scale(.94)}.op{background:#ff9f43;color:#fff}.fn{background:#44445e;color:#ddd}.eq{background:#ee5253}.zero{grid-column:span 2}</style></head><body><div class="calc"><div class="title">dentaku</div><div class="display"><div class="expr" id="expr"></div><div class="result" id="result">0</div></div><div class="grid"><button class="fn" data-act="clear">AC</button><button class="fn" data-act="sign">±</button><button class="fn" data-act="percent">%</button><button class="op" data-op="/">÷</button><button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button><button class="op" data-op="*">×</button><button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button><button class="op" data-op="-">−</button><button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button><button class="op" data-op="+">+</button><button class="zero" data-num="0">0</button><button data-num=".">.</button><button class="eq" data-act="eq">=</button></div></div><script>(function(){var cur='0',prev=null,op=null,reset=false;var rEl=document.getElementById('result'),eEl=document.getElementById('expr');var sym={'/':'÷','*':'×','-':'−','+':'+'};function fmt(n){if(n==='')return'0';var num=parseFloat(n);if(isNaN(num))return n;if(!isFinite(num))return'Error';var s=num.toString();if(s.length>12&&!Number.isInteger(num))s=num.toPrecision(10).replace(/\.?0+$/,'');return s;}function upd(){rEl.textContent=cur.length>14?parseFloat(cur).toExponential(6):cur;eEl.textContent=(prev!==null?fmt(prev)+' '+(op?sym[op]:''):'');}function inputNum(d){if(reset){cur='0';reset=false;}if(d==='.'){if(cur.indexOf('.')>=0)return;}if(cur==='0'&&d!=='.')cur=d;else cur+=d;upd();}function calc(a,b,o){a=parseFloat(a);b=parseFloat(b);switch(o){case'+':return a+b;case'-':return a-b;case'*':return a*b;case'/':return b===0?NaN:a/b;}return b;}function setOp(o){if(op&&!reset){var r=calc(prev,cur,op);prev=isNaN(r)?null:r;cur=isNaN(r)?'Error':fmt(r);}else{prev=parseFloat(cur);}op=o;reset=true;upd();}function equals(){if(op===null)return;var r=calc(prev,cur,op);cur=isNaN(r)?'Error':fmt(r);prev=null;op=null;reset=true;eEl.textContent='';rEl.textContent=cur;}function clearAll(){cur='0';prev=null;op=null;reset=false;upd();}function sign(){if(cur==='0'||cur==='Error')return;cur=cur.charAt(0)==='-'?cur.slice(1):'-'+cur;upd();}function percent(){cur=fmt(parseFloat(cur)/100);upd();}document.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){if(b.dataset.num!==undefined)inputNum(b.dataset.num);else if(b.dataset.op!==undefined)setOp(b.dataset.op);else{var a=b.dataset.act;if(a==='clear')clearAll();else if(a==='sign')sign();else if(a==='percent')percent();else if(a==='eq')equals();}});});document.addEventListener('keydown',function(e){var k=e.key;if(k>='0'&&k<='9')inputNum(k);else if(k==='.')inputNum('.');else if(k==='+'||k==='-'||k==='*'||k==='/')setOp(k);else if(k==='Enter'||k==='='){e.preventDefault();equals();}else if(k==='Escape')clearAll();else if(k==='Backspace'){if(!reset){cur=cur.length>1?cur.slice(0,-1):'0';upd();}}else if(k==='%')percent();});upd();})();</script></body></html>
