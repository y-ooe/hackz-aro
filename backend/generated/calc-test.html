<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>calc-test 電卓</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3c72,#2a5298);padding:20px}.calc{width:320px;background:#22252d;border-radius:24px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.5)}.display{background:#15171d;border-radius:16px;padding:20px;margin-bottom:18px;text-align:right;min-height:110px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}.history{color:#7a7f8c;font-size:15px;min-height:20px;word-break:break-all}.current{color:#fff;font-size:42px;font-weight:600;word-break:break-all;line-height:1.1}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}button{border:none;border-radius:16px;height:62px;font-size:22px;font-weight:600;cursor:pointer;transition:.15s;color:#fff}button:active{transform:scale(.93)}.num{background:#363b47}.num:hover{background:#414756}.op{background:#ff9f0a}.op:hover{background:#ffb340}.fn{background:#5a5f6d}.fn:hover{background:#6b7180}.eq{background:#0a84ff}.eq:hover{background:#3a9bff}.span2{grid-column:span 2}h1{color:#fff;text-align:center;font-size:16px;margin-bottom:14px;letter-spacing:2px;opacity:.7;font-weight:400}</style></head><body><div class="calc"><h1>CALC-TEST</h1><div class="display"><div class="history" id="history"></div><div class="current" id="current">0</div></div><div class="keys"><button class="fn" data-act="clear">AC</button><button class="fn" data-act="sign">±</button><button class="fn" data-act="percent">%</button><button class="op" data-op="/">÷</button><button class="num" data-num="7">7</button><button class="num" data-num="8">8</button><button class="num" data-num="9">9</button><button class="op" data-op="*">×</button><button class="num" data-num="4">4</button><button class="num" data-num="5">5</button><button class="num" data-num="6">6</button><button class="op" data-op="-">−</button><button class="num" data-num="1">1</button><button class="num" data-num="2">2</button><button class="num" data-num="3">3</button><button class="op" data-op="+">+</button><button class="num span2" data-num="0">0</button><button class="num" data-act="dot">.</button><button class="eq" data-act="eq">=</button></div></div><script>const curEl=document.getElementById('current'),histEl=document.getElementById('history');let cur='0',prev=null,op=null,reset=false;const opSym={'+':'+','-':'−','*':'×','/':'÷'};function upd(){curEl.textContent=cur;histEl.textContent=prev!==null&&op?prev+' '+opSym[op]:''}function inputNum(n){if(reset){cur='0';reset=false}cur=cur==='0'?n:cur+n;upd()}function inputDot(){if(reset){cur='0';reset=false}if(!cur.includes('.'))cur+='.';upd()}function setOp(o){if(op&&!reset){compute()}prev=cur;op=o;reset=true;upd()}function compute(){if(op===null||prev===null)return;const a=parseFloat(prev),b=parseFloat(cur);let r=0;switch(op){case'+':r=a+b;break;case'-':r=a-b;break;case'*':r=a*b;break;case'/':r=b===0?NaN:a/b;break}r=Math.round(r*1e10)/1e10;cur=isNaN(r)?'Error':String(r);prev=null;op=null;reset=true;histEl.textContent='';upd()}function clear(){cur='0';prev=null;op=null;reset=false;upd()}function sign(){if(cur!=='0'&&cur!=='Error')cur=cur.startsWith('-')?cur.slice(1):'-'+cur;upd()}function percent(){cur=String(parseFloat(cur)/100);upd()}document.querySelectorAll('button').forEach(b=>{b.addEventListener('click',()=>{if(b.dataset.num!==undefined)inputNum(b.dataset.num);else if(b.dataset.op)setOp(b.dataset.op);else switch(b.dataset.act){case'clear':clear();break;case'sign':sign();break;case'percent':percent();break;case'dot':inputDot();break;case'eq':compute();break}})});document.addEventListener('keydown',e=>{const k=e.key;if(/[0-9]/.test(k))inputNum(k);else if(k==='.')inputDot();else if(['+','-','*','/'].includes(k))setOp(k);else if(k==='Enter'||k==='='){e.preventDefault();compute()}else if(k==='Escape')clear();else if(k==='%')percent();else if(k==='Backspace'){cur=cur.length>1?cur.slice(0,-1):'0';upd()}});upd();</script></body></html>
