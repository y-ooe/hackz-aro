<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>todo-demo</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:40px 16px}.app{background:#fff;width:100%;max-width:480px;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden}header{background:#5a4ad1;color:#fff;padding:24px}header h1{font-size:1.6rem}header p{opacity:.8;font-size:.85rem;margin-top:4px}.input-area{display:flex;gap:8px;padding:20px}.input-area input{flex:1;padding:12px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:1rem;outline:none;transition:.2s}.input-area input:focus{border-color:#5a4ad1}.input-area button{background:#5a4ad1;color:#fff;border:none;padding:0 20px;border-radius:10px;font-size:1rem;cursor:pointer;transition:.2s}.input-area button:hover{background:#4738b8}.filters{display:flex;gap:8px;padding:0 20px 12px}.filters button{flex:1;background:#f0f0f5;border:none;padding:8px;border-radius:8px;cursor:pointer;font-size:.85rem;color:#666;transition:.2s}.filters button.active{background:#5a4ad1;color:#fff}ul{list-style:none;max-height:340px;overflow-y:auto}li{display:flex;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid #f0f0f0;animation:fade .3s}@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}li .chk{width:22px;height:22px;border:2px solid #ccc;border-radius:50%;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s}li.done .chk{background:#5a4ad1;border-color:#5a4ad1}li .chk svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;opacity:0}li.done .chk svg{opacity:1}li .txt{flex:1;word-break:break-all;font-size:1rem}li.done .txt{text-decoration:line-through;color:#aaa}li .del{background:none;border:none;color:#e57373;font-size:1.2rem;cursor:pointer;opacity:.6;transition:.2s}li .del:hover{opacity:1}.empty{text-align:center;color:#bbb;padding:40px 20px;font-size:.9rem}footer{padding:14px 20px;font-size:.8rem;color:#888;border-top:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center}footer button{background:none;border:none;color:#e57373;cursor:pointer;font-size:.8rem}</style></head><body><div class="app"><header><h1>✓ TODO List</h1><p>シンプルなタスク管理</p></header><div class="input-area"><input id="inp" type="text" placeholder="新しいタスクを入力..." maxlength="100"><button id="add">追加</button></div><div class="filters"><button data-f="all" class="active">すべて</button><button data-f="active">未完了</button><button data-f="done">完了</button></div><ul id="list"></ul><footer><span id="count"></span><button id="clear">完了を削除</button></footer></div><script>const inp=document.getElementById('inp'),add=document.getElementById('add'),list=document.getElementById('list'),count=document.getElementById('count'),clear=document.getElementById('clear');let todos=JSON.parse(localStorage.getItem('todos-demo')||'[]'),filter='all';function save(){localStorage.setItem('todos-demo',JSON.stringify(todos))}function render(){list.innerHTML='';let f=todos.filter(t=>filter==='all'?true:filter==='active'?!t.done:t.done);if(f.length===0){list.innerHTML='<div class="empty">タスクがありません</div>'}f.forEach(t=>{const li=document.createElement('li');if(t.done)li.className='done';li.innerHTML='<div class="chk"><svg viewBox="0 0 24 24"><polyline points="4 12 9 17 20 6"/></svg></div><span class="txt"></span><button class="del">×</button>';li.querySelector('.txt').textContent=t.text;li.querySelector('.chk').onclick=()=>{t.done=!t.done;save();render()};li.querySelector('.del').onclick=()=>{todos=todos.filter(x=>x.id!==t.id);save();render()};list.appendChild(li)});const left=todos.filter(t=>!t.done).length;count.textContent=`未完了: ${left} 件 / 全 ${todos.length} 件`}function addTodo(){const v=inp.value.trim();if(!v)return;todos.unshift({id:Date.now(),text:v,done:false});inp.value='';save();render()}add.onclick=addTodo;inp.addEventListener('keydown',e=>{if(e.key==='Enter')addTodo()});clear.onclick=()=>{todos=todos.filter(t=>!t.done);save();render()};document.querySelectorAll('.filters button').forEach(b=>{b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}});render();</script></body></html>
